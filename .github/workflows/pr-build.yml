name: PR Build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  core:
    name: Core, API e UI (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          source-url: https://nuget.pkg.github.com/toletus/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Toletus.Hub.API
        run: dotnet build "src/Toletus.Hub.API/Toletus.Hub.API.csproj" --configuration Release

      - name: Build Toletus.Hub.Manager.UI
        run: dotnet build "src/Toletus.Hub.Manager.UI/Toletus.Hub.Manager.UI.csproj" --configuration Release

      # Mesmo caminho dos workflows de release, sem publicar: pega pack quebrado
      # antes de alguém disparar o Main.
      - name: Empacotar Toletus.Hub (sem publicar)
        run: dotnet pack "src/Toletus.Hub/Toletus.Hub.csproj" --configuration Release /p:PackageVersion=0.0.0-ci

  manager:
    name: Gerenciador MAUI (windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          source-url: https://nuget.pkg.github.com/toletus/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A workload completa é necessária mesmo compilando só windows/android:
      # o restore avalia todos os TargetFrameworks do csproj, inclusive ios e
      # maccatalyst.
      - name: Instalar workload MAUI
        run: dotnet workload install maui

      - name: Build net10.0-windows
        run: dotnet build "src/Toletus.Hub.Manager.Maui/Toletus.Hub.Manager.Maui.csproj" -f net10.0-windows10.0.19041.0 --configuration Release

      - name: Build net10.0-android
        run: dotnet build "src/Toletus.Hub.Manager.Maui/Toletus.Hub.Manager.Maui.csproj" -f net10.0-android --configuration Release
